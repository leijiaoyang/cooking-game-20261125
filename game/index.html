<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — A Cooking Game</title>
<style>
  html, body { margin: 0; padding: 0; background: #2b1a08; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Trebuchet MS', Verdana, sans-serif;
  }
  #wrap { width: 1280px; max-width: 100vw; }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #f7e8c9;
    border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    cursor: pointer;
  }
  #hint {
    color: #ffe0b2;
    font-size: 14px;
    text-align: center;
    padding: 10px 0 0;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="hint">Sizzle &amp; Serve — click a station to walk there, Space to use it, 1–5 to jump between stations, R for recipes, P to pause, M to mute.</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
